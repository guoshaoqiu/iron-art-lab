<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>铁板爻画</title>
    <link rel="stylesheet" href="/public/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">Iron Art Lab</div>
        <div class="topbar-right">
          <div class="badge">AI 命理实验</div>
          <a class="github-link" href="https://github.com/guoshaoqiu/iron-art-lab" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
          </a>
        </div>
      </header>

      <header class="hero">
        <p class="eyebrow">铁板爻画 · Beta</p>
        <h1>铁板爻画</h1>
        <p>输入基础信息，获取 AI 生成的娱乐性命理解读。</p>
      </header>

      <div class="layout">
        <section class="panel panel-form">
          <h2>信息录入</h2>
          <form id="analyze-form">
            <label>
              昵称
              <input id="nickname" name="nickname" type="text" maxlength="100" required />
            </label>

            <div class="quick-actions">
              <button id="fill-example-btn" class="secondary-btn" type="button">填入示例</button>
            </div>
            <p class="field-hint">格式参考：xxxx年农历x月xx日 xx时</p>

            <label>
              本人八字信息
              <textarea
                id="selfBazi"
                name="selfBazi"
                rows="2"
                maxlength="500"
                placeholder="例如：1995年农历八月初三 19点生人，男"
                required
              ></textarea>
            </label>

            <label>
              父亲八字信息
              <textarea
                id="fatherBazi"
                name="fatherBazi"
                rows="2"
                maxlength="500"
                placeholder="例如：1971年农历六月十九"
                required
              ></textarea>
            </label>

            <label>
              母亲八字信息
              <textarea
                id="motherBazi"
                name="motherBazi"
                rows="2"
                maxlength="500"
                placeholder="例如：1971年农历四月二十七"
                required
              ></textarea>
            </label>

            <label>
              兄弟姐妹情况
              <textarea id="siblings" name="siblings" rows="2" maxlength="500" required></textarea>
            </label>

            <label>
              婚姻状况
              <select id="maritalStatus" name="maritalStatus" required>
                <option value="">请选择</option>
                <option value="未婚">未婚</option>
                <option value="已婚">已婚</option>
                <option value="离异">离异</option>
                <option value="其他">其他</option>
              </select>
            </label>

            <label>
              补充说明（可选）
              <textarea id="note" name="note" rows="3" maxlength="1000"></textarea>
            </label>

            <label class="checkbox">
              <input id="consent" name="consent" type="checkbox" required />
              我已知晓并同意：以上信息仅用于本次分析，不作为事实依据，结果仅供娱乐参考。
            </label>

            <button id="submit-btn" type="submit">生成分析</button>
          </form>
        </section>

        <section class="panel panel-result">
          <h2>分析结果</h2>
          <p id="meta" class="meta"></p>
          <div id="result" class="result">请先提交信息。</div>
          <div class="followup">
            <h3>继续追问</h3>
            <form id="followup-form">
              <textarea
                id="followup-input"
                name="followup"
                rows="2"
                maxlength="800"
                placeholder="例如：结合刚才的结果，详细说说我未来三年的事业和学业规划。"
                disabled
              ></textarea>
              <button id="followup-btn" type="submit" disabled>发送追问</button>
            </form>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
    <script src="/public/app.js" defer></script>
  </body>
</html>
